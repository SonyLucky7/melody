services:
  - type: web
    name: melody
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FREE_MODE
        value: "true"
      - key: MAX_CONCURRENT_STREAMS
        value: "20"
      - key: TELEGRAM_CHANNEL_ID
        value: "-1004311926734"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKENS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
