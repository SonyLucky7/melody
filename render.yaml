services:
  - type: web
    name: melody
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FREE_MODE
        value: "true"
      - key: MAX_CONCURRENT_STREAMS
        value: "50"
      - key: STREAM_CHANNEL_ID
        value: "-1004311926734"
      - key: DATABASE_URL
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LICENSE_ENC_KEY
        generateValue: true
