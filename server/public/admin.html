<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melody - Admin Upload Portal</title>
  <link rel="icon" type="image/png" href="/Melody-AppIcon-1024.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0f0f13] text-white min-h-screen p-6 antialiased">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Top Brand Header -->
    <header class="flex items-center justify-between border-b border-[#242432] pb-5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-extrabold text-xl shadow-lg shadow-blue-500/20">
          M
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight flex items-center gap-2">
            Melody <span class="text-xs uppercase font-bold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Admin Portal</span>
          </h1>
          <p class="text-xs text-neutral-400">Upload and manage audio permanently stored in Telegram</p>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <a href="http://localhost:3000" target="_blank" class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-lg text-neutral-300 font-semibold transition-colors">
          Open Web Player ↗
        </a>
      </div>
    </header>

    <!-- Admin Secret Configuration Bar -->
    <div class="bg-[#16161f] border border-[#242432] rounded-xl p-4 flex items-center justify-between gap-4">
      <div class="flex-1">
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-wider mb-1">Admin Secret Token</label>
        <input 
          id="adminSecret" 
          type="password" 
          value="melody-admin-access-token-9876" 
          class="w-full bg-[#0f0f13] border border-[#2a2a3a] focus:border-blue-500 rounded-lg px-3 py-1.5 text-xs text-white outline-none font-mono"
        />
      </div>
      <button 
        onclick="refreshSongList()" 
        class="mt-5 px-4 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-xs font-bold rounded-lg transition-colors"
      >
        Save & Refresh
      </button>
    </div>

    <!-- Upload Card -->
    <div class="bg-[#16161f] border border-[#242432] rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-blue-400">
        <span>Upload MP3 to Telegram Channel</span>
      </h2>

      <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

      <form id="uploadForm" class="space-y-4">
        <!-- Drag & Drop Zone -->
        <div 
          id="dropZone"
          class="border-2 border-dashed border-[#2a2a3a] hover:border-blue-500/60 rounded-2xl p-8 text-center cursor-pointer transition-colors bg-[#0f0f13]/50"
        >
          <input type="file" id="audioFile" accept="audio/mp3,audio/mpeg" class="hidden" required />
          <div class="flex flex-col items-center gap-2">
            <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p id="audioFileName" class="text-sm font-bold text-white">Click or drag & drop MP3 song file</p>
            <p class="text-xs text-neutral-500">MP3 only, up to 320 kbps studio quality (Max 20 MB Telegram Bot limit)</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">Song Title *</label>
            <input type="text" id="title" placeholder="e.g. Blinding Lights" required class="w-full bg-[#0f0f13] border border-[#2a2a3a] focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">Artist *</label>
            <input type="text" id="artist" placeholder="e.g. The Weeknd" required class="w-full bg-[#0f0f13] border border-[#2a2a3a] focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">Album (optional)</label>
            <input type="text" id="album" placeholder="e.g. After Hours" class="w-full bg-[#0f0f13] border border-[#2a2a3a] focus:border-blue-500 rounded-xl px-3.5 py-2 text-sm text-white outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">Language</label>
            <select id="language" class="w-full bg-[#0f0f13] border border-[#2a2a3a] focus:border-blue-500 rounded-xl px-3 py-2 text-sm text-white outline-none">
              <option value="english">English</option>
              <option value="hindi">Hindi</option>
              <option value="tamil">Tamil</option>
              <option value="telugu">Telugu</option>
              <option value="punjabi">Punjabi</option>
              <option value="instrumental">Instrumental</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">Cover Image (optional)</label>
            <input type="file" id="coverFile" accept="image/jpeg,image/png" class="w-full text-xs text-neutral-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-neutral-200 hover:file:bg-neutral-700 cursor-pointer" />
          </div>
        </div>

        <button 
          id="submitBtn" 
          type="submit" 
          class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-extrabold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2"
        >
          <span>Upload Track & Index in Telegram</span>
        </button>
      </form>
    </div>

    <!-- Live Track Catalog List -->
    <div class="bg-[#16161f] border border-[#242432] rounded-2xl p-6 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-white">Live Catalog Tracks</h2>
        <span id="trackCount" class="text-xs text-neutral-400 font-semibold">0 tracks</span>
      </div>

      <div id="trackList" class="space-y-2">
        <div class="text-center py-8 text-neutral-500 text-xs">Loading tracks...</div>
      </div>
    </div>

  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const audioFileInput = document.getElementById('audioFile');
    const audioFileName = document.getElementById('audioFileName');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const adminSecretInput = document.getElementById('adminSecret');

    // Drag and drop interaction
    dropZone.addEventListener('click', () => audioFileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500');
      if (e.dataTransfer.files.length > 0) {
        audioFileInput.files = e.dataTransfer.files;
        updateFileLabel();
      }
    });
    audioFileInput.addEventListener('change', updateFileLabel);

    function updateFileLabel() {
      if (audioFileInput.files.length > 0) {
        const file = audioFileInput.files[0];
        const mb = (file.size / 1024 / 1024).toFixed(2);
        audioFileName.innerHTML = `<span class="text-blue-400">Selected:</span> ${file.name} (${mb} MB)`;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!audioFileInput.files[0]) {
        showAlert('Please choose an MP3 file.', 'red');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Uploading to Telegram & Database...</span>';
      showAlert('', '');

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('artist', document.getElementById('artist').value);
      formData.append('album', document.getElementById('album').value);
      formData.append('language', document.getElementById('language').value);
      formData.append('audio', audioFileInput.files[0]);

      const cover = document.getElementById('coverFile').files[0];
      if (cover) formData.append('cover', cover);

      try {
        const res = await fetch('/api/admin/upload', {
          method: 'POST',
          headers: {
            'x-admin-secret': adminSecretInput.value.trim()
          },
          body: formData
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showAlert(`✅ "${data.data.title}" successfully uploaded to Telegram Channel and saved to DB!`, 'green');
          form.reset();
          audioFileName.textContent = 'Click or drag & drop MP3 song file';
          refreshSongList();
        } else {
          showAlert(`❌ ${data.message || 'Upload failed.'}`, 'red');
        }
      } catch (err) {
        showAlert(`❌ Network error: ${err.message}`, 'red');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Upload Track & Index in Telegram</span>';
      }
    });

    function showAlert(text, color) {
      if (!text) {
        alertBox.classList.add('hidden');
        return;
      }
      alertBox.textContent = text;
      alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${
        color === 'green' ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400' : 'bg-red-500/10 border border-red-500/20 text-red-400'
      }`;
    }

    async function refreshSongList() {
      try {
        const res = await fetch('/api/songs?limit=100');
        const data = await res.json();
        const container = document.getElementById('trackList');
        const countSpan = document.getElementById('trackCount');

        if (data.data && data.data.length > 0) {
          countSpan.textContent = `${data.data.length} tracks`;
          container.innerHTML = data.data.map(song => `
            <div class="flex items-center justify-between p-3 rounded-xl bg-[#0f0f13] border border-[#242432]">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-neutral-800 flex items-center justify-center font-bold text-xs text-neutral-400">
                  #${song.id}
                </div>
                <div class="flex flex-col">
                  <span class="text-sm font-bold text-white">${song.title}</span>
                  <span class="text-xs text-neutral-400">${song.artist} • ${song.album || 'Single'} (${song.language})</span>
                </div>
              </div>
              <div class="text-xs text-neutral-500 font-mono">
                ${Math.floor(song.duration_seconds / 60)}:${(song.duration_seconds % 60).toString().padStart(2, '0')}
              </div>
            </div>
          `).join('');
        } else {
          countSpan.textContent = '0 tracks';
          container.innerHTML = '<div class="text-center py-8 text-neutral-500 text-xs">No tracks uploaded yet.</div>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    refreshSongList();
  </script>
</body>
</html>
