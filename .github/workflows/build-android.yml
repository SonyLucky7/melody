name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.2.1.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.2.1
          path: android/app/build/outputs/apk/debug/Melody-v1.2.1.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: Melody Android App v1.2.1 (Spotify Lock Screen & Zero-Cut Engine)
          body: |
            ### 🎵 Melody Android v1.2.1 (Spotify Lock Screen & Zero-Cut Engine)
            - 🔒 Full Spotify-Grade Lock Screen & Notification Media Card on every Android phone (high-res artwork, live progress scrubber, Like/Saved toggle, Prev/Play-Pause/Next, Shuffle toggle, Bluetooth & audio output switcher)
            - 🎧 Eliminated mid-song cutting & pausing: OkHttp ExoPlayer streaming, 30s–120s adaptive buffer, 6x automatic retry, position-preserving mid-song recovery, and full native background queue playback
            - 💜 Added "Adithi" Telugu Melodies public curated playlist (25 tracks) visible to everyone
            - 📥 Android-exclusive Offline Storage for 100% internet-free playback
          files: android/app/build/outputs/apk/debug/Melody-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.2.1.apk client/public/Melody-v1.2.1.apk
          cp android/app/build/outputs/apk/debug/Melody-v1.2.1.apk client/public/Melody-latest.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.2.1.apk client/public/Melody-latest.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.2.1.apk [skip ci]"
          git push
