name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.1.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.1.0
          path: android/app/build/outputs/apk/debug/Melody-v1.1.0.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Melody Android App v1.1.0 (Spotify TV Edition)
          body: |
            ### 🎵 Melody Android v1.1.0 (Spotify TV Edition)
            - 📺 Dedicated Spotify TV 10-Foot Leanback Experience with left navigation rail and focusable shelves
            - 🇧🇷 Uploaded 10 viral Brazil Phonk anthems to Telegram cloud & Postgres database
            - 🎮 Full TV remote D-Pad navigation with animated focus borders and scale effects
            - 🎛️ Full-screen TV Now Playing view with large 3D album cover, live progress, and queue preview
            - 🔒 Comprehensive secret security audit with zero hardcoded credentials
          files: android/app/build/outputs/apk/debug/Melody-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.1.0.apk client/public/Melody-v1.1.0.apk
          cp android/app/build/outputs/apk/debug/Melody-v1.1.0.apk client/public/Melody-latest.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.1.0.apk client/public/Melody-latest.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.1.0.apk [skip ci]"
          git push
