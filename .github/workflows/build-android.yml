name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.0.7.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.0.7
          path: android/app/build/outputs/apk/debug/Melody-v1.0.7.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: Melody Android App v1.0.7
          body: |
            ### 🎵 Melody Android v1.0.7
            - Spotify-grade mobile layout & full public playlist carousel (Motivation Vol. 1 & 2, TikTok Phonk, Slowed Reverb, Sidhu Moose Wala, Honey Singh, Weeknd, Lana, Ariana)
            - Full 552-track high-speed parallel pagination & persistent SharedPreferences instant caching
            - Popular Artists carousel and Library screen with all 7 featured artists & verified discographies
            - Curated Public Playlists with rich cover art and description previews in both Home and Library
            - Direct scoped offline storage on device with zero-data playback
            - Pinned bottom mini player and seamless back-navigation
          files: android/app/build/outputs/apk/debug/Melody-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.0.7.apk client/public/Melody-v1.0.7.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.0.7.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.0.7.apk [skip ci]"
          git push
