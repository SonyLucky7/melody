name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.2.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.2.0
          path: android/app/build/outputs/apk/debug/Melody-v1.2.0.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Melody Android App v1.2.0 (Offline Vault & Spotify Edition)
          body: |
            ### 🎵 Melody Android v1.2.0 (Offline Vault & Spotify Edition)
            - 📥 Android-Exclusive Offline Storage: Save individual tracks, Liked Songs, Artists, or entire Playlists to local device storage with live progress and play 100% without internet (including local album artwork)
            - 🎧 Fixed ExoPlayer local file:// playback, cold-start service queueing, automatic Render-to-Vercel failover, and buffering indicators
            - 🔥 Added Top The Weeknd Songs curated playlist (28 tracks) and synced all 834+ catalog tracks across healthy Telegram bots
            - 🎯 Fixed artist matching accuracy, playlist deduplication, and Android TV D-Pad controls
          files: android/app/build/outputs/apk/debug/Melody-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.2.0.apk client/public/Melody-v1.2.0.apk
          cp android/app/build/outputs/apk/debug/Melody-v1.2.0.apk client/public/Melody-latest.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.2.0.apk client/public/Melody-latest.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.2.0.apk [skip ci]"
          git push
