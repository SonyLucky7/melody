name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.0.9.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.0.9
          path: android/app/build/outputs/apk/debug/Melody-v1.0.9.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: Melody Android App v1.0.9
          body: |
            ### 🎵 Melody Android v1.0.9
            - Fixed mid-song playback cutoff by clearing stream connect timeouts once response starts
            - Optimized ExoPlayer queue transitions to prevent dual stream buffering underruns
            - High-speed 5-bot concurrent Telegram resolution (~100ms URL lookup)
            - Fixed 100% of missing playlist and artist cover images on Android, Google TV, and Web
            - Enhanced smart TV navigation and back button handling
          files: android/app/build/outputs/apk/debug/Melody-v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.0.9.apk client/public/Melody-v1.0.9.apk
          cp android/app/build/outputs/apk/debug/Melody-v1.0.9.apk client/public/Melody-latest.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.0.9.apk client/public/Melody-latest.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.0.9.apk [skip ci]"
          git push
