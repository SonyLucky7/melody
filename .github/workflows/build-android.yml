name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.0.5.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.0.5
          path: android/app/build/outputs/apk/debug/Melody-v1.0.5.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Melody Android App v1.0.5
          body: |
            ### 🎵 Melody Android v1.0.5
            - Instant <1s playback with dedicated Telegram Bot priority lanes
            - Lifetime VIP Bot 1 priority & Annual VIP Bot 2 priority
            - Google AdMob listening gate: 30-min guest pass, 60-min annual, and 180-min cumulative lifetime tracking
            - Full Spotify profile integration with PostgreSQL cloud sync
            - Android 7.0 (Nougat) to Android 15+ support
          files: android/app/build/outputs/apk/debug/Melody-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
