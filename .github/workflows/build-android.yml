name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.0.8.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.0.8
          path: android/app/build/outputs/apk/debug/Melody-v1.0.8.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: Melody Android App v1.0.8
          body: |
            ### 🎵 Melody Android v1.0.8
            - Instant zero-delay playback engine with atomic streaming and in-flight deduplication
            - Next track pre-buffering and pre-warming in ExoPlayer for 0ms transitions on skip and shuffle
            - Multi-bot Telegram concurrency scaling and connection pool optimization
            - 552-track high-speed parallel pagination and persistent 0ms cold-start cache
          files: android/app/build/outputs/apk/debug/Melody-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to client/public
        run: |
          cp android/app/build/outputs/apk/debug/Melody-v1.0.8.apk client/public/Melody-v1.0.8.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.0.8.apk
          git diff --staged --quiet || git commit -m "Auto-deploy Melody-v1.0.8.apk [skip ci]"
          git push
