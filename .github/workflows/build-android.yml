name: Build Melody Android Release & Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode Release Keystore (if configured in GitHub Secrets)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.MELODY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 --decode > android/keystore/melody-release.jks
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Signed Release AAB & APK (Indus Appstore Ready)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          MELODY_KEYSTORE_PATH: keystore/melody-release.jks
          MELODY_KEYSTORE_PASSWORD: ${{ secrets.MELODY_KEYSTORE_PASSWORD }}
          MELODY_KEY_ALIAS: ${{ secrets.MELODY_KEY_ALIAS }}
          MELODY_KEY_PASSWORD: ${{ secrets.MELODY_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Melody-v1.2.6.apk
          cp app/build/outputs/bundle/release/app-release.aab ../Melody-v1.2.6.aab

      - name: Build Debug Fallback APK (when release secrets are not configured in CI)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Melody-v1.2.6-debug.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.2.6
          path: |
            Melody-v1.2.6*.apk
            Melody-v1.2.6.aab
          retention-days: 30

      - name: Release Signed APK to GitHub & Web (only when signed release built)
        if: steps.keystore.outputs.signed == 'true'
        run: |
          cp Melody-v1.2.6.apk client/public/Melody-v1.2.6.apk
          cp Melody-v1.2.6.apk client/public/Melody-latest.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/Melody-v1.2.6.apk client/public/Melody-latest.apk
          git diff --staged --quiet || git commit -m "Auto-deploy signed Melody-v1.2.6.apk [skip ci]"
          git push
