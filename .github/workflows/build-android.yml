name: Build Melody Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk Melody-v1.0.6.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Android-v1.0.6
          path: android/app/build/outputs/apk/debug/Melody-v1.0.6.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Melody Android App v1.0.6
          body: |
            ### 🎵 Melody Android v1.0.6
            - Spotify-grade mobile layout & full public playlist carousel (Motivation Vol. 1 & 2, TikTok Phonk, Slowed Reverb, Sidhu Moose Wala, Honey Singh, Weeknd, Lana, Ariana)
            - 1000 track catalog sync with instant 0ms track playback
            - Popular Artists carousel with all 7 featured artists & verified discographies
            - Direct scoped offline storage on device with zero-data playback
            - Pinned bottom mini player and seamless back-navigation
          files: android/app/build/outputs/apk/debug/Melody-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
